<!DOCTYPE html>
<html><head><title>Login - DiaPredict</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://www.google.com/recaptcha/api.js" async defer></script></head>
<body class="auth-body"><div class="auth-card">
<div class="auth-header"><div class="auth-logo">🩺</div><h2>Welcome Back</h2>
<p>Log in to access your dashboard</p></div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST" action="{{ url_for('login') }}">
<div class="form-group"><label>Username</label><input type="text" name="username" required placeholder="Username"></div>
<div class="form-group"><label>Password</label><input type="password" name="password" required placeholder="Password"></div>
<div class="g-recaptcha" data-sitekey="{{ site_key }}" style="margin: 15px 0;"></div>
<button type="submit" class="btn-primary btn-block">Log In</button></form>
<p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div></body></html>
